[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritascore"
version = "1.0.0"
description = "Post-hoc LLM verification engine for hallucination detection"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "VeritasCore Team"}]

dependencies = [
    # Core ML
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "sentence-transformers>=2.2.0",
    "tokenizers>=0.15.0",

    # NLI
    "scipy>=1.11.0",

    # API
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Search/Retrieval
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",

    # Scoring
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",

    # Config
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",

    # Logging
    "structlog>=23.2.0",
    "rich>=13.7.0",

    # Hardware validation
    "psutil>=5.9.0",

    # Datasets
    "datasets>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]
ollama = ["ollama>=0.1.0"]
xgboost = ["xgboost>=2.0.0"]
demo = ["gradio>=4.0.0"]

[project.scripts]
veritascore = "veritascore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["A002", "A003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
